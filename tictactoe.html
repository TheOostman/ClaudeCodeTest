<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 2px;
      color: #e94560;
    }

    .scoreboard {
      display: flex;
      gap: 2rem;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
    }

    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #16213e;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      min-width: 70px;
    }

    .score-item .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
      margin-bottom: 2px;
    }

    .score-item .value {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .score-item.x-score .value { color: #e94560; }
    .score-item.o-score .value { color: #0f3460; filter: brightness(3); }
    .score-item.draw-score .value { color: #aaa; }

    .status {
      font-size: 1.2rem;
      margin-bottom: 1.2rem;
      height: 1.5rem;
      color: #ccc;
    }

    .status .highlight {
      font-weight: bold;
      color: #e94560;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 8px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.04);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #53d8fb; }

    .cell.win {
      background: #0f3460;
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .controls {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
    }

    button {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:hover { opacity: 0.85; transform: scale(1.03); }

    #btn-restart {
      background: #e94560;
      color: #fff;
    }

    #btn-reset-scores {
      background: #16213e;
      color: #aaa;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>

  <div class="scoreboard">
    <div class="score-item x-score">
      <span class="label">X</span>
      <span class="value" id="score-x">0</span>
    </div>
    <div class="score-item draw-score">
      <span class="label">Draw</span>
      <span class="value" id="score-draw">0</span>
    </div>
    <div class="score-item o-score">
      <span class="label">O</span>
      <span class="value" id="score-o">0</span>
    </div>
  </div>

  <div class="status" id="status">Player <span class="highlight">X</span>'s turn</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <div class="controls">
    <button id="btn-restart">New Game</button>
    <button id="btn-reset-scores">Reset Scores</button>
  </div>

  <script>
    const cells = document.querySelectorAll('.cell');
    const statusEl = document.getElementById('status');
    const scoreX = document.getElementById('score-x');
    const scoreO = document.getElementById('score-o');
    const scoreDraw = document.getElementById('score-draw');

    const WINS = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    let board, current, gameOver, scores;

    function init() {
      board = Array(9).fill('');
      current = 'X';
      gameOver = false;
      cells.forEach(c => {
        c.textContent = '';
        c.className = 'cell';
      });
      setStatus(`Player <span class="highlight">${current}</span>'s turn`);
    }

    function initScores() {
      scores = { X: 0, O: 0, Draw: 0 };
      updateScoreBoard();
    }

    function updateScoreBoard() {
      scoreX.textContent = scores.X;
      scoreO.textContent = scores.O;
      scoreDraw.textContent = scores.Draw;
    }

    function setStatus(html) {
      statusEl.innerHTML = html;
    }

    function checkWinner() {
      for (const [a, b, c] of WINS) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return [a, b, c];
        }
      }
      return null;
    }

    function handleClick(e) {
      const cell = e.currentTarget;
      const idx = parseInt(cell.dataset.index);
      if (gameOver || board[idx]) return;

      board[idx] = current;
      cell.textContent = current;
      cell.classList.add(current.toLowerCase(), 'taken');

      const winLine = checkWinner();
      if (winLine) {
        winLine.forEach(i => cells[i].classList.add('win'));
        setStatus(`Player <span class="highlight">${current}</span> wins!`);
        scores[current]++;
        updateScoreBoard();
        gameOver = true;
        return;
      }

      if (board.every(v => v)) {
        setStatus('It\'s a <span class="highlight">draw</span>!');
        scores.Draw++;
        updateScoreBoard();
        gameOver = true;
        return;
      }

      current = current === 'X' ? 'O' : 'X';
      setStatus(`Player <span class="highlight">${current}</span>'s turn`);
    }

    cells.forEach(c => c.addEventListener('click', handleClick));
    document.getElementById('btn-restart').addEventListener('click', init);
    document.getElementById('btn-reset-scores').addEventListener('click', () => {
      initScores();
      init();
    });

    initScores();
    init();
  </script>
</body>
</html>
